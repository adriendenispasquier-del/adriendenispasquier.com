<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien Denis-Pasquier</title>
  <meta name="description" content="Multidisciplinary creative based in Berlin, working across brand design, illustration, photography and visual direction.">
  <link rel="canonical" href="https://adriendenispasquier.com/">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.json">
  <!-- Fonts: Adobe Fonts kit (Redaction, Degular Mono) -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nva7btn.css">
  <!-- The two header signs (𓇗 colour shift, 𓆣 settings): only these two characters of the font are downloaded -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&text=%F0%93%87%97%F0%93%86%A3&display=block">
</head>
<body>
  <canvas id="c"></canvas>

  <header class="hd">
    <a href="/" data-p data-k="h1">Adrien Denis-Pasquier</a>
    <div class="hicons">
      <button type="button" id="invert" class="glyph" data-p data-k="h2" aria-pressed="false" aria-label="Colour shift" title="Colour shift">𓇗</button>
      <button type="button" id="vbtn" class="glyph" data-p data-k="h3" aria-expanded="false" aria-controls="vmenu" aria-label="Settings" title="Settings">𓆣</button>
    </div>
    <a href="/about/" data-p data-k="h4">About</a>
    <div class="hline" data-p data-k="hline"></div>
  </header>

  <!-- Visitor settings, opened with 𓆣 in the header -->
  <div class="vmenu" id="vmenu" role="dialog" aria-label="Settings">
    <label class="vrow vdesk"><span>Text</span><input type="range" id="v-t" min="15" max="60" step="0.1"></label>
    <label class="vrow"><span>Film</span><input type="range" id="v-f" min="3" max="20" step="0.1"></label>
    <label class="vrow"><span>Dots</span><input type="range" id="v-dot" min="0.3" max="1.6" step="0.05"></label>
    <label class="vrow"><span>Buzz</span><input type="range" id="v-buzz" min="0" max="3" step="0.05"></label>
    <div class="vrow vbtns"><button type="button" id="v-reset">Reset</button></div>
  </div>

  <main id="M">
    <div class="lcol"><div class="lscroll" id="L"></div></div>
    <div class="vrule" data-p data-k="vrule"></div>
    <div class="gal" id="G"><div class="gtrack" id="GT"></div></div>
  </main>
  <!-- The film stays outside the scrolling main column: iOS Safari clips fixed elements to a scrolling parent. -->
  <div class="fwrap">
    <div class="film" id="F"><div class="ftrack" id="FT"></div></div>
    <div class="frame" id="frame"></div>
  </div>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Picture">
    <button class="lbx" type="button" aria-label="Close"></button>
    <div class="lbm" id="lbm"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
