<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien Denis-Pasquier</title>
  <meta name="description" content="Multidisciplinary creative based in Berlin, working across brand design, illustration, photography and visual direction.">
  <link rel="canonical" href="https://adriendenispasquier.com/">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.json">
  <!-- Fonts: Adobe Fonts kit (Redaction, Degular Mono) -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nva7btn.css">
  <!-- The colour-swap sign (𓇗): only this character of the font is downloaded -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&text=%F0%93%87%97&display=block">
</head>
<body>
  <canvas id="c"></canvas>

  <header class="hd">
    <a href="/" data-p data-k="h1">Adrien Denis-Pasquier</a>
    <div class="hicons">
      <button type="button" id="abtn" class="abtn" aria-expanded="false">About</button>
      <button type="button" id="invert" class="glyph" data-p data-k="h2" aria-pressed="false" aria-label="Swap colours" title="Swap colours">𓇗</button>
    </div>
    <div class="hline" data-p data-k="hline"></div>
  </header>

  <main id="M">
    <div class="lcol"><div class="lscroll" id="L"></div></div>
    <div class="vrule" data-p data-k="vrule"></div>
    <div class="gal" id="G"><div class="gtrack" id="GT"></div></div>
  </main>
  <!-- The film stays outside the scrolling main column: iOS Safari clips fixed elements to a scrolling parent. -->
  <div class="fwrap">
    <div class="film" id="F"><div class="ftrack" id="FT"></div></div>
    <div class="frame" id="frame"></div>
  </div>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Picture">
    <button class="lbx" type="button" aria-label="Close"></button>
    <div class="lbm" id="lbm"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
