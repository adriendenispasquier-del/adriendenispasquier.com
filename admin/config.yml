# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Admin for adriendenispasquier.com (Sveltia CMS). Open /admin/ and sign in with a GitHub token
# (fine-grained, this repository only, Contents: read and write). Saving commits to main; the site rebuilds itself.

backend:
  name: github
  repo: adriendenispasquier-del/adriendenispasquier.com
  branch: main

site_url: https://adriendenispasquier.com


# Uploads go to the site itself (public/uploads, served at /uploads/…).
media_folder: public/uploads
public_folder: /uploads

# Uploads are prepared in the browser before they are sent: photos (JPEG, PNG…) become WebP of at most
# 2400 px, which keeps saves small and fast. Animated GIFs are kept as they are. Files over 10 MB are refused
# with a message (big videos and GIFs belong on Cloudinary: paste their link instead).
media_libraries:
  default:
    config:
      max_file_size: 10000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400
  # Cloudinary: to upload to and pick from your Cloudinary library too, add your API key below and remove the #s.
  # (Cloudinary → Settings → API Keys. The key is public; never put the API secret here.)
  # cloudinary:
  #   config:
  #     cloud_name: df2kod03a
  #     api_key: "YOUR_API_KEY"

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: One entry per project. Its file name becomes its address, e.g. fat-cat → /work/fat-cat/.
    folder: content/projects
    format: json
    create: true
    delete: true
    identifier_field: title
    summary: "{{order}} · {{title}} — {{type}}"
    sortable_fields: [order, title, type]
    preview_path: /work/{{slug}}/
    fields:
      - { name: title, label: Title, widget: string }
      - name: type
        label: Type
        widget: string
        hint: Shown next to the name in the Work list, e.g. Brand Identity, Photography.
      - name: order
        label: Position in the list
        widget: number
        value_type: int
        default: 99
        hint: Smaller numbers come first.
      - name: services
        label: Services
        widget: list
        hint: One per line. Shown under the title.
      - name: text
        label: Text
        widget: text
        hint: "Separate paragraphs with an empty line. Links: [text](https://…)"
      - name: credits
        label: Credits
        widget: list
        required: false
        collapsed: auto
        summary: "{{label}}: {{value}}"
        fields:
          - { name: label, label: Label, widget: string, hint: "e.g. Featuring, Creative direction" }
          - { name: value, label: Names, widget: string, hint: "Links inside: [text](https://…)" }
          - { name: url, label: Link, widget: string, required: false, hint: "Optional: links the names, e.g. https://instagram.com/…" }
      - name: media
        label: Pictures and videos
        widget: list
        hint: In page order; drag to reorder. The first one is the cover unless one is set below.
        field: { name: item, label: Picture or video, widget: file }
      - { name: cover, label: Cover (optional), widget: file, required: false, hint: Picture for the Work page and link previews. }
      - { name: personal, label: Personal, widget: boolean, required: false, default: false, hint: "Shown under Personal (Pasquier in the header) instead of Work." }
      - { name: draft, label: Hidden, widget: boolean, required: false, default: false, hint: Hidden projects are not on the site. }

  - name: site
    label: Site
    files:
      - name: about
        label: About & site texts
        file: content/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: description, label: Description, widget: text, hint: For search engines and link previews. }
          - name: about
            label: About page
            widget: object
            fields:
              - { name: text, label: Text, widget: text, hint: "Separate paragraphs with an empty line. Links: [text](https://…)" }
              - { name: practice, label: Practice, widget: list, hint: One per line. }
              - name: contact
                label: Contact
                widget: list
                summary: "{{label}}"
                fields:
                  - { name: label, label: Label, widget: string, hint: "e.g. Email, Instagram" }
                  - { name: url, label: Link, widget: string, required: false, hint: "mailto:you@example.com or https://…" }
              - { name: portrait, label: Portrait, widget: image, required: false }

      - name: look
        label: Look (colours, layout, dots)
        file: content/settings.json
        fields:
          - name: colors
            label: Colours
            widget: object
            hint: Easier to adjust live on the site with ?tune, then copy the values here.
            fields:
              - name: default
                label: Default
                widget: object
                fields:
                  - { name: bg, label: Background, widget: color }
                  - { name: ink, label: Text & dots, widget: color }
              - name: pages
                label: Pages with their own colours
                widget: list
                required: false
                summary: "{{page}}"
                fields:
                  - { name: page, label: Page, widget: string, hint: "Address: / (Work), /about/, /work/fat-cat/ …" }
                  - { name: bg, label: Background, widget: color }
                  - { name: ink, label: Text & dots, widget: color }
          - name: layout
            label: Layout — desktop
            widget: object
            hint: "In % of the window width. Text + pictures + film = 100."
            fields:
              - { name: gap, label: Gaps, widget: number, value_type: float, step: 0.1 }
              - { name: t, label: Text, widget: number, value_type: float, step: 0.1 }
              - { name: p, label: Pictures, widget: number, value_type: float, step: 0.1 }
              - { name: f, label: Film, widget: number, value_type: float, step: 0.1 }
          - name: layoutPhone
            label: Layout — phone
            widget: object
            hint: "In % of the screen width. Main + film = 100."
            fields:
              - { name: gap, label: Gaps, widget: number, value_type: float, step: 0.1 }
              - { name: m, label: Main column, widget: number, value_type: float, step: 0.1 }
              - { name: f, label: Film, widget: number, value_type: float, step: 0.1 }
          - name: grid
            label: Grid
            widget: select
            default: open
            hint: "Open: lines between things. Closed: the lines close into cells. None: no lines."
            options:
              - { label: Closed, value: closed }
              - { label: Open, value: open }
              - { label: None, value: none }
          - name: type
            label: Font sizes
            widget: object
            hint: "Multipliers: 1 = default, 1.2 = 20% bigger."
            fields:
              - { name: name, label: Name (header), widget: number, value_type: float, step: 0.02, default: 1 }
              - { name: titles, label: Titles, widget: number, value_type: float, step: 0.02, default: 1 }
              - { name: lists, label: Lists, widget: number, value_type: float, step: 0.02, default: 1 }
              - { name: text, label: Text, widget: number, value_type: float, step: 0.02, default: 1 }
          - name: dots
            label: Dots
            widget: object
            fields:
              - { name: shape, label: Shape, widget: select, options: [round, square] }
              - { name: dotSize, label: Dot size, widget: number, value_type: float, step: 0.05 }
              - { name: fill, label: Fill, widget: number, value_type: float, step: 0.01 }
              - { name: buzz, label: Buzz, widget: number, value_type: float, step: 0.05 }
              - { name: real, label: Body text turns into real type, widget: boolean }
